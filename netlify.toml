[build]
command = "npm --workspace client run build"
publish = "client/dist"

[[redirects]]
from = "/assets/*"
to = "/404.html"
status = 404

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
X-Frame-Options = "DENY"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
for = "/sw.js"
[headers.values]
Cache-Control = "no-cache"

[[headers]]
for = "/index.html"
[headers.values]
Cache-Control = "no-cache"

[[headers]]
for = "/"
[headers.values]
Cache-Control = "no-cache"
