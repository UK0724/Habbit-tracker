services:
  - type: web
    name: habit-tracker-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build:server
    startCommand: npm --workspace server run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY_HOPS
        value: 1
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: JWT_SECRET
        sync: false
