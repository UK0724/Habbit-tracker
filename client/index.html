<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <script>
      // Apply saved theme before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var raw = localStorage.getItem("habit-theme");
          var mode = "system";
          var accent = "indigo";
          if (raw) {
            var parsed = JSON.parse(raw);
            var s = parsed && parsed.state ? parsed.state : parsed;
            if (s) {
              mode = s.mode || mode;
              accent = s.accent || accent;
            }
          }
          var resolved = mode;
          if (mode === "system") {
            resolved =
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          }
          var root = document.documentElement;
          root.setAttribute("data-theme", resolved);
          root.setAttribute("data-accent", accent);
        } catch (e) {}
      })();
    </script>
    <meta
      name="description"
      content="Arc — track your habits, streaks, and spending in one place."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%236366f1'/%3E%3Cpath d='M4.5 17.5C8 17 11 13.5 12.5 9.5C13.5 6.8 15.8 5.5 19 5.5' fill='none' stroke='white' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='19' cy='5.5' r='2.1' fill='white'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <title>Arc — daily tracker</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
