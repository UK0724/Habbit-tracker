<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <script>
      // Apply saved theme before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var raw = localStorage.getItem("habit-theme");
          var mode = "system";
          var accent = "indigo";
          if (raw) {
            var parsed = JSON.parse(raw);
            var s = parsed && parsed.state ? parsed.state : parsed;
            if (s) {
              mode = s.mode || mode;
              accent = s.accent || accent;
            }
          }
          var resolved = mode;
          if (mode === "system") {
            resolved =
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          }
          var root = document.documentElement;
          root.setAttribute("data-theme", resolved);
          root.setAttribute("data-accent", accent);
        } catch (e) {}
      })();
    </script>
    <meta
      name="description"
      content="Pulse — Master your habits, streaks, and routines with effortless tracking."
    />
    <link rel="icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#6366f1" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pulse" />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <title>Pulse — Daily Habit & Routine Tracker</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
